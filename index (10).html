function editCard(id){const old=data.cards.find(c=>c.id===id),c=old?clone(old):{id:uid(),type:'text',w:2,h:2,title:'New card',links:[],items:[]};const f=dialog(old?'Edit card':'Add card');field(f,'Card type','type',c.type,'select',types);const dims=el('div','fields');f.append(dims);const w=field(dims,'Width (columns 1–6)','w',c.w,'number');w.min=1;w.max=6;w.required=true;const h=field(dims,'Height (rows 1–5)','h',c.h,'number');h.min=1;h.max=5;h.required=true;field(f,'Small label','label',c.label);field(f,'Title','title',c.title);field(f,'Description','text',c.text,'textarea');field(f,'Stat value / initials','value',c.value);const imageField=field(f,'Image URL or local image path','image',c.image);const upload=field(f,'Or upload image (PNG/JPEG/WebP/GIF, max 1 MB)','upload','','file');upload.accept='image/png,image/jpeg,image/webp,image/gif';let pending=false;upload.onchange=()=>{const file=upload.files[0];if(!file)return;if(file.size>1000000||!/^image\/(png|jpeg|webp|gif)$/.test(file.type)){alert('Use a supported image under 1 MB.');upload.value='';return}pending=true;const r=new FileReader();r.onload=()=>{imageField.value=r.result;pending=false};r.onerror=()=>{pending=false;alert('Image could not be read')};r.readAsDataURL(file)};field(f,'Tools / tags (one per line)','items',c.items?.join('\n'),'textarea');field(f,'Links (one per line: Label | https://...)','links',c.links?.map(l=>l.label+' | '+l.url).join('\n'),'textarea');f.append(el('p','notice','For video cards, add a preview image and a YouTube or other video link.'));actions(f,'Save card');f.onsubmit=e=>{e.preventDefault();if(pending)return;const v=Object.fromEntries(new FormData(f));delete v.upload;const links=v.links.split('\n').filter(x=>x.trim()).map(x=>{const i=x.indexOf('|');return i<0?{label:'Open',url:x.trim()}:{label:x.slice(0,i).trim(),url:x.slice(i+1).trim()}});if(links.some(l=>!safeUrl(l.url))){alert('Use valid HTTP(S) links.');return}const n={...c,...v,w:+v.w,h:+v.h,items:v.items.split('\n').map(x=>x.trim()).filter(Boolean),links};change(()=>{if(old)data.cards[data.cards.findIndex(x=>x.id===id)]=n;else data.cards.push(n)});$('modal').close()}}
function appearance(){const f=dialog('Appearance');field(f,'Brand','brand',data.brand);field(f,'Header','header',data.header);field(f,'Footer','footer',data.footer);const g=el('div','fields');f.append(g);for(const k of ['bg','tile','ink','muted','line'])field(g,k,k,data.theme[k],'color');for(const [k,min,max] of [['gap',4,24],['radius',0,32]]){const n=field(g,k,k,data.theme[k],'number');n.min=min;n.max=max;n.required=true}field(f,'Font','font',data.theme.font,'select',['system-ui,sans-serif','Arial,sans-serif','Georgia,serif','monospace']);actions(f,'Save appearance');f.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f));change(()=>{for(const k of ['brand','header','footer'])data[k]=v[k];for(const k of Object.keys(data.theme))data.theme[k]=['gap','radius'].includes(k)?+v[k]:v[k]});$('modal').close()}}
const dataOpen='<script id="portfolio-data" type="application/json">',dataClose='</scr'+'ipt>';
function dataRange(html){const a=html.indexOf(dataOpen);if(a<0)throw Error('Upload this single-file index.html first.');const begin=a+dataOpen.length,end=html.indexOf(dataClose,begin);if(end<0)throw Error('Invalid embedded portfolio data.');return {begin,end}}
function readHTML(html){const {begin,end}=dataRange(html);return normalize(JSON.parse(html.slice(begin,end)))}
function writeHTML(html,obj){const {begin,end}=dataRange(html);return html.slice(0,begin)+'\n'+JSON.stringify(obj,null,2).replace(/</g,'\\u003c')+'\n'+html.slice(end)}
function download(){const u=URL.createObjectURL(new Blob([writeHTML(sourceHTML,data)],{type:'text/html;charset=utf-8'}));const a=el('a');a.href=u;a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function b64(s){const bytes=new TextEncoder().encode(s);let out='';for(let i=0;i<bytes.length;i+=8192)out+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(out)}function unb64(s){return new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)))}
async function api(url,token,opts={}){const r=await fetch(url,{...opts,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}});let j;try{j=await r.json()}catch{j={}}return {r,j}}
function github(){const f=dialog('GitHub publishing');$('modal').addEventListener('close',()=>{const token=f.querySelector('[name=token]');if(token)token.value='';},{once:true});f.append(el('p','notice','Create a fine-grained personal access token for this repository with Contents: Read and write. Token is only used in this dialog, never saved. Upload index.html to the Pages source first.'));field(f,'Owner','owner','Korobbka');field(f,'Repository','repo','Mistral');field(f,'Branch','branch','main');field(f,'Path relative to repository root','path','index.html');const tk=field(f,'Personal access token','token','','password');tk.autocomplete='off';tk.required=true;const msg=el('p','notice');f.append(msg);const row=el('div','actions');f.append(row);const load=btn('Load remote',()=>run(false));const pub=btn('Publish draft',()=>run(true),'primary');row.append(btn('Cancel',()=>$('modal').close()),load,pub);f.onsubmit=e=>e.preventDefault();async function run(write){if(busy)return;const v=Object.fromEntries(new FormData(f));if(!v.token||!v.owner||!v.repo||!v.branch||!v.path){msg.textContent='Fill all fields.';return}if(!/^[\w.-]+$/.test(v.owner)||!/^[-\w.]+$/.test(v.repo)||v.path.split('/').some(p=>!p||p==='.'||p==='..')||!v.path.endsWith('.html')){msg.textContent='Invalid repository or HTML path.';return}const base='https://api.github.com/repos/'+encodeURIComponent(v.owner)+'/'+encodeURIComponent(v.repo)+'/contents/'+v.path.split('/').map(encodeURIComponent).join('/');const key=base+'?ref='+encodeURIComponent(v.branch);busy=true;load.disabled=pub.disabled=true;msg.textContent='Connecting…';try{const {r,j}=await api(key,v.token);if(!r.ok&&r.status!==404)throw Error(j.message||'HTTP '+r.status);let remoteHTML=sourceHTML;if(r.ok){if(!j.sha||j.type!=='file')throw Error('Remote path is not a file.');if(j.content)remoteHTML=unb64(j.content);else{const raw=await fetch(key,{headers:{Accept:'application/vnd.github.raw+json',Authorization:'Bearer '+v.token,'X-GitHub-Api-Version':'2022-11-28'}});if(!raw.ok)throw Error('Could not read remote HTML.');remoteHTML=await raw.text()}}if(!write){if(!r.ok)throw Error('Remote HTML not found. Publish to create it.');const incoming=readHTML(remoteHTML);if(!confirm('Replace current draft with remote portfolio?'))return;change(()=>data=incoming);remoteSha=j.sha;remoteKey=key;remoteSnapshot=clone(incoming);msg.textContent='Remote portfolio loaded.';return}if(r.ok&&(!j.sha||j.type!=='file'))throw Error('Remote path is not a file.');if(r.ok&&((remoteKey===key&&remoteSha!==j.sha)||(remoteKey!==key&&JSON.stringify(readHTML(remoteHTML))!==JSON.stringify(published)))){if(!confirm('Remote content differs from the loaded version. Overwrite it with your draft?'))return}if(!confirm('Publish current draft to '+v.owner+'/'+v.repo+' ('+v.branch+')?'))return;const payload={message:'Update portfolio',content:b64(writeHTML(remoteHTML,data)),branch:v.branch};if(r.ok)payload.sha=j.sha;const result=await api(base,v.token,{method:'PUT',body:JSON.stringify(payload)});if(!result.r.ok)throw Error(result.j.message||'HTTP '+result.r.status);remoteSha=result.j.content?.sha;remoteKey=key;remoteSnapshot=clone(data);published=clone(data);try{localStorage.removeItem(storage)}catch{}msg.textContent='Committed successfully. GitHub Pages deployment may take a few minutes.';status('GitHub commit saved.');tk.value=''}catch(err){msg.textContent='GitHub: '+err.message}finally{busy=false;load.disabled=pub.disabled=false}}}
$('add').onclick=()=>editCard();$('appearance').onclick=appearance;$('undo').onclick=undo;$('redo').onclick=redo;$('export').onclick=download;$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const file=$('file').files[0];if(!file)return;try{const content=await file.text();const n=file.name.toLowerCase().endsWith('.html')?readHTML(content):normalize(JSON.parse(content));if(confirm('Replace current draft with imported file?'))change(()=>data=n)}catch(e){status('Import failed: '+e.message)}$('file').value=''};$('publish').onclick=github;$('discard').onclick=()=>{if(confirm('Discard local changes and restore published version?')){data=clone(published);history=[];future=[];try{localStorage.removeItem(storage)}catch{}render()}};function toggle(){editing=!editing;render()}$('edit').onclick=toggle;$('done').onclick=toggle;document.addEventListener('keydown',e=>{if(!editing||$('modal').open||!(e.ctrlKey||e.metaKey))return;if(e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(e.key.toLowerCase()==='y'){e.preventDefault();redo()}});
(()=>{try{published=readHTML(sourceHTML)}catch(e){status('Could not load embedded portfolio: '+e.message)}data=clone(published);try{const s=localStorage.getItem(storage);if(s){data=normalize(JSON.parse(s));status('Local draft loaded. Only this browser sees unpublished changes.')}}catch{}render()})();
